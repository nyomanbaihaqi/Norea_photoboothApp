name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Rilis dibuat dulu sebagai draft. Kalau tidak, electron-builder bisa membuat
      # 2 rilis sekaligus karena upload paralel (pernah terjadi di v0.1.0).
      - name: Buat draft rilis
        run: gh release create ${{ github.ref_name }} --draft --title "Norea Photobooth ${{ github.ref_name }}" --generate-notes

      - name: Build & upload installer
        run: npx electron-vite build && npx electron-builder --win --publish always

      - name: Terbitkan rilis
        run: gh release edit ${{ github.ref_name }} --draft=false --latest
