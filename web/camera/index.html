<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <title>Kamera HP · Norea Photobooth</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <style>
      body {
        background: #000;
        overflow: hidden;
      }
      video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      .mirror {
        transform: scaleX(-1);
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        z-index: 5;
      }
      .top {
        top: 0;
        padding-top: max(12px, env(safe-area-inset-top));
        background: linear-gradient(#000c, transparent);
      }
      .bottom {
        bottom: 0;
        padding-bottom: max(14px, env(safe-area-inset-bottom));
        background: linear-gradient(transparent, #000c);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #0009;
        font-size: 14px;
        font-weight: 600;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #f59e0b;
      }
      .dot.ok {
        background: #34d399;
      }
      .dot.err {
        background: #ef4444;
      }
      #count {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40vmin;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 0 40px #000;
        pointer-events: none;
        z-index: 6;
      }
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 7;
        transition: opacity 0.4s;
      }
      #start {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: var(--bg);
      }
      .small {
        padding: 10px 16px;
        font-size: 14px;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  </head>
  <body>
    <video id="video" playsinline muted autoplay></video>
    <div id="count" hidden></div>
    <div id="flash"></div>

    <div class="bar top">
      <div class="logo" style="font-size: 18px">NOREA<span>.</span></div>
      <div class="pill"><span class="dot" id="dot"></span><span id="status">Menyiapkan…</span></div>
    </div>
    <div class="bar bottom">
      <button class="btn btn-ghost small" id="switch">🔄 Depan/Belakang</button>
      <button class="btn btn-ghost small" id="fs">⛶ Layar penuh</button>
    </div>

    <div id="start" class="center">
      <div class="logo" style="font-size: 36px">NOREA<span>.</span></div>
      <p class="muted">Jadikan HP ini kamera photobooth</p>
      <ol style="text-align: left; max-width: 320px; line-height: 1.7; font-size: 14px" class="muted">
        <li>Taruh HP di tripod/holder menghadap tamu</li>
        <li>Tekan tombol di bawah & izinkan akses kamera</li>
        <li>Biarkan layar HP tetap menyala</li>
      </ol>
      <button class="btn btn-primary" id="go" style="margin-top: 12px">📷 Sambungkan kamera</button>
      <p id="startErr" style="color: #f87171; max-width: 320px"></p>
    </div>

    <script>
      ;(function () {
        var boothId = new URLSearchParams(location.search).get('peer') || ''
        var video = document.getElementById('video')
        var statusEl = document.getElementById('status')
        var dot = document.getElementById('dot')
        var countEl = document.getElementById('count')
        var flash = document.getElementById('flash')
        var facing = 'environment'
        var stream = null
        var peer = null
        var conn = null
        var call = null
        var wakeLock = null
        var retryTimer = null

        function setStatus(text, kind) {
          statusEl.textContent = text
          dot.className = 'dot' + (kind ? ' ' + kind : '')
        }

        if (!/^norea-[a-f0-9]{16}$/.test(boothId)) {
          document.getElementById('go').disabled = true
          document.getElementById('startErr').textContent = 'Link tidak valid. Scan ulang QR dari layar booth.'
          return
        }

        async function openCamera() {
          if (stream) stream.getTracks().forEach(function (t) { t.stop() })
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: facing },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          })
          video.srcObject = stream
          video.className = facing === 'user' ? 'mirror' : ''
          await video.play().catch(function () {})
          return stream
        }

        async function keepAwake() {
          try {
            if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen')
          } catch (e) {}
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') keepAwake()
        })

        function connect() {
          clearTimeout(retryTimer)
          setStatus('Menyambung ke booth…')
          if (!peer || peer.destroyed) {
            peer = new Peer({ debug: 1 })
            peer.on('open', startCall)
            peer.on('error', function (err) {
              if (err.type === 'peer-unavailable') setStatus('Booth tidak ditemukan. Cek layar booth.', 'err')
              else setStatus('Koneksi error, mencoba lagi…', 'err')
              scheduleRetry()
            })
            peer.on('disconnected', function () {
              if (!peer.destroyed) peer.reconnect()
            })
          } else if (peer.open) startCall()
        }

        function scheduleRetry() {
          clearTimeout(retryTimer)
          retryTimer = setTimeout(connect, 4000)
        }

        function startCall() {
          if (conn) conn.close()
          if (call) call.close()
          conn = peer.connect(boothId, { reliable: true, serialization: 'binary' })
          conn.on('open', function () {
            call = peer.call(boothId, stream)
            call.on('close', function () {
              setStatus('Terputus, menyambung ulang…', 'err')
              scheduleRetry()
            })
            setStatus('Tersambung ke booth', 'ok')
          })
          conn.on('data', onMessage)
          conn.on('close', function () {
            setStatus('Terputus, menyambung ulang…', 'err')
            scheduleRetry()
          })
        }

        function onMessage(msg) {
          if (!msg || !msg.type) return
          if (msg.type === 'countdown') {
            countEl.hidden = false
            countEl.textContent = msg.n
          } else if (msg.type === 'capture') {
            countEl.hidden = true
            capture(msg.id)
          } else if (msg.type === 'done') {
            countEl.hidden = true
          }
        }

        function frameBlob() {
          var c = document.createElement('canvas')
          c.width = video.videoWidth
          c.height = video.videoHeight
          c.getContext('2d').drawImage(video, 0, 0)
          return new Promise(function (resolve) {
            c.toBlob(resolve, 'image/jpeg', 0.92)
          })
        }

        async function takePhoto() {
          var track = stream && stream.getVideoTracks()[0]
          if (window.ImageCapture && track) {
            try {
              var ic = new ImageCapture(track)
              var blob = await Promise.race([
                ic.takePhoto(),
                new Promise(function (_, rej) {
                  setTimeout(function () { rej(new Error('timeout')) }, 3000)
                })
              ])
              if (blob && blob.size > 0) return blob
            } catch (e) {}
          }
          return frameBlob()
        }

        async function capture(id) {
          flash.style.transition = 'none'
          flash.style.opacity = '1'
          requestAnimationFrame(function () {
            flash.style.transition = 'opacity .4s'
            flash.style.opacity = '0'
          })
          try {
            var blob = await takePhoto()
            var buf = await blob.arrayBuffer()
            if (conn && conn.open) conn.send({ type: 'photo', id: id, data: buf, mime: blob.type || 'image/jpeg' })
          } catch (e) {
            if (conn && conn.open) conn.send({ type: 'photo', id: id })
          }
        }

        document.getElementById('go').onclick = async function () {
          try {
            await openCamera()
            document.getElementById('start').hidden = true
            keepAwake()
            connect()
          } catch (e) {
            document.getElementById('startErr').textContent =
              'Tidak bisa membuka kamera: ' + (e && e.name === 'NotAllowedError' ? 'izin ditolak' : e.message)
          }
        }

        document.getElementById('switch').onclick = async function () {
          facing = facing === 'user' ? 'environment' : 'user'
          await openCamera()
          var track = stream.getVideoTracks()[0]
          if (call && call.peerConnection) {
            call.peerConnection.getSenders().forEach(function (s) {
              if (s.track && s.track.kind === 'video') s.replaceTrack(track)
            })
          }
        }

        document.getElementById('fs').onclick = function () {
          if (document.fullscreenElement) document.exitFullscreen()
          else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen()
        }
      })()
    </script>
  </body>
</html>
